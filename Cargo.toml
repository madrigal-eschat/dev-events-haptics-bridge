[package]
name = "haptics"
version = "1.1.0"
edition = "2024"

[[bin]]
name = "haptics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
